name: visit-alerts
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a bit)
  workflow_dispatch:
concurrency: visit-alerts     # never run two copies at once
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: seen.db
          key: seen-db-${{ github.run_id }}
          restore-keys: seen-db-
      - run: python monitor.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SCREEN_MODEL: ${{ secrets.SCREEN_MODEL }}
          VERIFY_MODEL: ${{ secrets.VERIFY_MODEL }}
          AI_PAUSE_SECONDS: ${{ secrets.AI_PAUSE_SECONDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
